services:
  backend:
    build: ./backend
    container_name: hybrid-backend
    ports:
      - "8000:8000"
    env_file: .env
    restart: always

  frontend:
    build: ./frontend
    container_name: hybrid-frontend
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - FASTAPI_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: always